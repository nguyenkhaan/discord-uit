services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloudian
      MINIO_ROOT_PASSWORD: cloudian
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    ports:
      - 9092:9092
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --create \
          --if-not-exists \
          --topic notification.events.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --bootstrap-server kafka:29092

        /opt/kafka/bin/kafka-topics.sh \
          --describe \
          --topic notification.events.v1 \
          --bootstrap-server kafka:29092

        for topic in \
          document.classification.requested.v1 \
          document.classification.completed.v1 \
          document.classification.failed.v1 \
          document.classification.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1 \
            --bootstrap-server kafka:29092
        done

  livekit:
    image: livekit/livekit-server:latest
    # node-ip 127.0.0.1: the browser on this machine connects to localhost.
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880" # HTTP API + WebSocket signaling
      - "7881:7881" # WebRTC over TCP (fallback)
      - "7882:7882/udp" # WebRTC over UDP
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  mailpit-data:
  minio-data:

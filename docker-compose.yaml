services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloudian
      MINIO_ROOT_PASSWORD: cloudian
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  kafka: 
    image: apache/kafka:4.3.1
    ports:
      - 9092:9092
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh \
          --create \
          --if-not-exists \
          --topic notification.events.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --bootstrap-server kafka:9092

        /opt/kafka/bin/kafka-topics.sh \
          --describe \
          --topic notification.events.v1 \
          --bootstrap-server kafka:9092
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: cloudian
      RABBITMQ_DEFAULT_PASS: cloudian
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mailpit-data:
  minio-data:
  rabbitmq-data:

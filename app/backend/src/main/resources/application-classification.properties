spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
app.classification.consumer.group-id=${CLASSIFICATION_CONSUMER_GROUP_ID:document-classification-results}
app.classification.max-attempts=${CLASSIFICATION_MAX_ATTEMPTS:3}
app.classification.outbox.max-attempts=3
app.classification.outbox.poll-delay-ms=5000

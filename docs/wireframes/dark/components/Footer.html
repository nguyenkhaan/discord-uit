<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Footer · UIT Server Discord</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #0f1218;
        --color-surface: #151a24;
        --color-border: #2b3445;
        --color-foreground: #f4f6fa;
        --color-secondary: #b5bfce;
        --color-focus: #9b96e8;
      }

      :root { color-scheme: dark; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body class="flex min-h-screen flex-col bg-canvas text-foreground antialiased">
    <main class="flex-1" aria-label="Page content"></main>
    <footer class="border-t border-border bg-surface">
      <div class="mx-auto w-full max-w-[1440px] px-5 sm:px-8 lg:px-12 xl:px-16">
        <div class="flex flex-col gap-2 py-5 lg:flex-row lg:items-center lg:justify-between lg:gap-8">
          <nav class="flex flex-wrap items-center gap-x-6" aria-label="Community support">
            <a href="/guidelines" class="inline-flex min-h-11 items-center rounded-sm text-sm text-secondary hover:text-foreground hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Forum rules</a>
            <a href="/help" class="inline-flex min-h-11 items-center rounded-sm text-sm text-secondary hover:text-foreground hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Help / FAQ</a>
            <a href="/contact" class="inline-flex min-h-11 items-center rounded-sm text-sm text-secondary hover:text-foreground hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Contact administrator</a>
          </nav>
          <nav class="flex flex-wrap items-center gap-x-6" aria-label="Legal">
            <a href="/terms" class="inline-flex min-h-11 items-center rounded-sm text-sm text-secondary hover:text-foreground hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Terms of Service</a>
            <a href="/privacy" class="inline-flex min-h-11 items-center rounded-sm text-sm text-secondary hover:text-foreground hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Privacy Policy</a>
          </nav>
        </div>
        <p class="border-t border-border py-5 text-xs leading-6 text-secondary">Copyright © 2026 UIT Server Discord. Powered by React.</p>
      </div>
    </footer>
  </body>
</html>

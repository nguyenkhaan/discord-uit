<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1218" />
    <title>Navbar · UIT Server Discord</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #0f1218;
        --color-surface: #151a24;
        --color-raised: #202737;
        --color-border: #2b3445;
        --color-foreground: #f4f6fa;
        --color-secondary: #b5bfce;
        --color-muted: #7f8a9c;
        --color-primary: #5b55b8;
        --color-primary-hover: #6a63c8;
        --color-focus: #9b96e8;
        --color-coral: #d47b72;
      }

      :root {
        color-scheme: dark;
        background: #0f1218;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .guest-state,
      .member-state {
        display: none;
      }

      #navbar-guest-state:checked ~ .preview-shell .guest-state,
      #navbar-member-state:checked ~ .preview-shell .member-state {
        display: flex;
      }

      #navbar-guest-state:checked ~ .preview-shell label[for="navbar-guest-state"],
      #navbar-member-state:checked ~ .preview-shell label[for="navbar-member-state"] {
        border-color: #9b96e8;
        background: #202737;
        color: #f4f6fa;
      }

      #navbar-guest-state:focus-visible ~ .preview-shell label[for="navbar-guest-state"],
      #navbar-member-state:focus-visible ~ .preview-shell label[for="navbar-member-state"] {
        outline: 2px solid #9b96e8;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen overflow-x-hidden bg-canvas text-foreground antialiased">
      <input id="navbar-guest-state" class="sr-only" type="radio" name="navbar-preview-state" checked />
      <input id="navbar-member-state" class="sr-only" type="radio" name="navbar-preview-state" />

      <div class="preview-shell min-h-screen">
        <header class="w-full border-b border-border bg-surface">
          <nav class="mx-auto flex min-h-18 w-full max-w-[1440px] items-center justify-between gap-4 px-4 py-3 sm:px-8 lg:px-12" aria-label="Primary navigation">
            <a id="navbar-brand-link" href="#home" class="inline-flex min-h-11 shrink-0 items-center gap-2 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-focus sm:gap-3" aria-label="UIT Server Discord home">
              <span class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-primary bg-primary text-white" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
                  <path d="M8 9h8" />
                  <path d="M8 13h5" />
                </svg>
              </span>
              <span class="hidden text-sm font-semibold tracking-[-0.01em] text-foreground min-[380px]:block sm:text-base">UIT Server Discord</span>
            </a>

            <div class="min-w-0">
              <div class="guest-state items-center gap-1 sm:gap-2">
                <a id="navbar-login-link" href="#login" class="inline-flex min-h-11 items-center rounded-lg px-3 text-sm font-medium text-secondary transition-colors hover:bg-raised hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus sm:px-4">Log in</a>
                <a id="navbar-register-link" href="#register" class="inline-flex min-h-11 items-center rounded-lg border border-primary px-3 text-sm font-semibold text-foreground transition-colors hover:bg-primary hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus sm:px-4">Register</a>
              </div>

              <div class="member-state items-center">
                <a id="navbar-account-link" href="#account-settings" class="inline-flex size-11 shrink-0 items-center justify-center rounded-full border border-border bg-raised text-secondary transition-colors hover:border-focus hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" aria-label="Open account settings">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </a>
              </div>
            </div>

          </nav>
        </header>

        <main class="mx-auto w-full max-w-[1440px] px-4 py-10 sm:px-8 lg:px-12 lg:py-16" aria-labelledby="navbar-preview-title">
          <div class="flex flex-col gap-7 border-b border-border pb-8 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p class="text-xs font-semibold tracking-[0.16em] text-coral uppercase">Shared component</p>
              <h1 id="navbar-preview-title" class="mt-3 text-3xl font-semibold tracking-[-0.03em] sm:text-4xl">Navbar states</h1>
              <p class="mt-3 max-w-xl text-sm leading-6 text-secondary">Preview the navigation for guests and signed-in users.</p>
            </div>

            <fieldset class="flex w-fit rounded-lg border border-border bg-surface p-1" aria-label="Navbar preview state">
              <legend class="sr-only">Navbar preview state</legend>
              <label for="navbar-guest-state" class="inline-flex min-h-10 cursor-pointer items-center rounded-md border border-transparent px-4 text-sm font-medium text-muted transition-colors hover:text-foreground focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-focus">Guest</label>
              <label for="navbar-member-state" class="inline-flex min-h-10 cursor-pointer items-center rounded-md border border-transparent px-4 text-sm font-medium text-muted transition-colors hover:text-foreground focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-focus">Signed in</label>
            </fieldset>
          </div>

          <div class="grid gap-4 py-10 sm:grid-cols-2 lg:grid-cols-3">
            <div class="h-28 rounded-xl border border-border bg-surface"></div>
            <div class="h-28 rounded-xl border border-border bg-surface sm:col-span-1 lg:col-span-2"></div>
            <div class="h-44 rounded-xl border border-border bg-surface sm:col-span-2 lg:col-span-3"></div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>

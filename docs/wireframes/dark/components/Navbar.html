<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Navbar · UIT Server Discord</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-canvas: #0f1218;
        --color-surface: #151a24;
        --color-raised: #202737;
        --color-border: #2b3445;
        --color-foreground: #f4f6fa;
        --color-secondary: #b5bfce;
        --color-brand: #5b55b8;
        --color-brand-hover: #373071;
        --color-focus: #9b96e8;
      }

      :root { color-scheme: dark; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-canvas text-foreground antialiased">
    <header class="border-b border-border bg-surface">
      <nav class="mx-auto flex min-h-16 w-full max-w-[1440px] items-center justify-between gap-3 px-4 py-2 sm:min-h-20 sm:px-8 sm:py-3 lg:px-12 xl:px-16" aria-label="Main navigation">
        <a id="brand-link" href="/login" class="inline-flex min-h-11 min-w-0 items-center gap-2 rounded-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-focus sm:gap-3" aria-label="UIT Server Discord home">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-lg border border-[#6c66c4] bg-brand text-white sm:size-10">
            <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
          </span>
          <span class="min-w-0 text-sm leading-tight font-semibold tracking-[-0.02em] sm:text-lg">UIT Server Discord</span>
        </a>

        <div id="guest-actions" class="ml-auto flex shrink-0 items-center gap-2">
          <a href="/login" class="inline-flex min-h-11 items-center rounded-sm text-sm font-semibold text-secondary underline decoration-1 underline-offset-4 transition-colors hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Login</a>
          <a href="/register" class="inline-flex min-h-11 items-center rounded-sm text-sm font-semibold text-secondary underline decoration-1 underline-offset-4 transition-colors hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Register</a>
        </div>

        <a id="account-link" href="/settings/account" hidden class="inline-flex size-12 shrink-0 items-center justify-center rounded-full border border-border bg-raised text-sm font-semibold text-foreground transition-colors hover:border-[#566176] hover:bg-[#2b3445] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" aria-label="Account settings for Jane Doe" title="Jane Doe — Account settings">JD</a>
      </nav>
    </header>

    <script>
      const signedIn = new URLSearchParams(window.location.search).get('state') === 'signed-in';
      document.querySelector('#guest-actions').hidden = signedIn;
      document.querySelector('#account-link').hidden = !signedIn;
      document.querySelector('#brand-link').href = signedIn ? '/servers' : '/login';
    </script>
  </body>
</html>

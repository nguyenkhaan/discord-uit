<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | UIT Server</title>
<script src="https://cdn.tailwindcss.com">
</script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js">
</script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');:root { --canvas: #0F1218; --surface: #151A24; --surface-raised: #202737; --text-primary: #F4F6FA; --text-secondary: #B5BFCE; --text-muted: #7F8A9C; --border: #2B3445; --primary: #5B55B8; --primary-hover: #6B64C8; --on-primary: #FFFFFF; --accent-coral: #D47B72; --focus-ring: #9B96E8; --error: #E17B87; --info: #82A9D6; } body { font-family: 'Inter', sans-serif; background-color: var(--canvas); color: var(--text-primary); margin: 0; padding: 0; line-height: 1.5; } .focus-visible:focus { outline: 2px solid var(--focus-ring); outline-offset: 2px; } input::placeholder { color: var(--text-muted); } </style>
</head>
<body>
<div class="grid min-h-screen w-full grid-cols-1 bg-[#151A24] lg:grid-cols-2" data-sd-id="1">
<section class="hidden min-h-screen items-center justify-center border-r border-[#2B3445] bg-[#0F1218] p-8 lg:flex lg:p-12 xl:p-16" data-sd-id="3">
<div class="relative w-full lg:w-4/5 xl:w-3/4" data-sd-id="4">
<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" data-sd-id="5">
<circle cx="200" cy="200" r="150" stroke="#2B3445" stroke-width="2" stroke-dasharray="8 8">
</circle>
<rect x="160" y="120" width="80" height="160" rx="8" fill="#151A24" stroke="#5B55B8" stroke-width="2">
</rect>
<path d="M160 160H240M160 200H240M160 240H240" stroke="#2B3445" stroke-width="2">
</path>
<rect x="100" y="220" width="40" height="60" rx="4" fill="#202737" stroke="#7F8A9C" stroke-width="2">
</rect>
<rect x="260" y="220" width="40" height="60" rx="4" fill="#202737" stroke="#7F8A9C" stroke-width="2">
</rect>
<circle cx="140" cy="140" r="20" fill="#202737" stroke="#B5BFCE" stroke-width="2">
</circle>
<circle cx="260" cy="140" r="20" fill="#202737" stroke="#B5BFCE" stroke-width="2">
</circle>
<path d="M140 160L160 180" stroke="#5B55B8" stroke-width="2" stroke-linecap="round">
</path>
<path d="M260 160L240 180" stroke="#5B55B8" stroke-width="2" stroke-linecap="round">
</path>
<path d="M120 220L160 200" stroke="#B5BFCE" stroke-width="1.5" opacity="0.5">
</path>
<path d="M280 220L240 200" stroke="#B5BFCE" stroke-width="1.5" opacity="0.5">
</path>
</svg>
<div class="mt-12 text-center" data-sd-id="6">
<h2 class="text-[#F4F6FA] text-2xl font-semibold mb-4" data-sd-id="7">Collaborative Environment</h2>
<p class="mx-auto w-4/5 text-[#B5BFCE]" data-sd-id="8">Connect with your peers in private servers, share knowledge in the public forum, and access the document library.</p>
</div>
</div>
</section>
<main class="flex min-h-screen items-center justify-center bg-[#151A24] px-6 py-12 sm:px-10 lg:px-16 xl:px-24" data-sd-id="9">
<div class="w-full lg:w-4/5 xl:w-3/5" data-sd-id="10">
<header class="mb-8" data-sd-id="11">
<h1 class="text-[#F4F6FA] text-[32px] md:text-[40px] font-bold tracking-tight leading-tight mb-2" data-sd-id="12">Welcome back</h1>
<p class="text-[#B5BFCE]" data-sd-id="13">Log in to your UIT Server account</p>
</header>
<div class="space-y-6" data-sd-id="14">
<a href="#" id="sso-login-link" class="flex items-center justify-center w-full h-[48px] px-4 bg-[#5B55B8] hover:bg-[#6B64C8] text-[#FFFFFF] font-medium rounded-[8px] transition-colors focus:outline-none focus:ring-2 focus:ring-[#9B96E8] focus:ring-offset-2 focus:ring-offset-[#151A24]" data-sd-id="15">
<iconify-icon icon="lucide:graduation-cap" class="mr-2 text-xl">
</iconify-icon>Continue with UIT SSO</a>
<div class="relative flex items-center py-2" data-sd-id="16">
<div class="flex-grow border-t border-[#2B3445]" data-sd-id="17">
</div>
<span class="flex-shrink mx-4 text-[#7F8A9C] text-sm font-medium" data-sd-id="18">OR</span>
<div class="flex-grow border-t border-[#2B3445]" data-sd-id="19">
</div>
</div>
<form action="#" method="POST" class="space-y-4" data-sd-id="20">
<div class="space-y-2" data-sd-id="21">
<label for="email" class="block text-sm font-medium text-[#B5BFCE]" data-sd-id="22">Email address</label>
<input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required="" class="w-full h-[48px] px-4 bg-[#202737] border border-[#2B3445] rounded-[8px] text-[#F4F6FA] placeholder-[#7F8A9C] focus:outline-none focus:ring-2 focus:ring-[#9B96E8] transition-all" data-sd-id="23">
</div>
<div class="space-y-2" data-sd-id="24">
<label for="password" class="block text-sm font-medium text-[#B5BFCE]" data-sd-id="25">Password</label>
<div class="relative" data-sd-id="26">
<input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required="" class="w-full h-[48px] pl-4 pr-12 bg-[#202737] border border-[#2B3445] rounded-[8px] text-[#F4F6FA] placeholder-[#7F8A9C] focus:outline-none focus:ring-2 focus:ring-[#9B96E8] transition-all" data-sd-id="27">
<button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#7F8A9C] hover:text-[#B5BFCE] transition-colors" aria-label="Toggle password visibility" data-sd-id="28">
<iconify-icon icon="lucide:eye" class="text-xl">
</iconify-icon>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-2" data-sd-id="29">
<a href="#" id="forgot-password-link" class="text-sm font-medium text-[#5B55B8] hover:text-[#6B64C8] transition-colors" data-sd-id="30">Forgot password?</a>
</div>
<button type="submit" class="w-full h-[48px] bg-[#202737] border border-[#2B3445] text-[#F4F6FA] font-semibold rounded-[8px] hover:bg-[#2B3445] transition-all focus:outline-none focus:ring-2 focus:ring-[#9B96E8]" data-sd-id="31">Sign in with email</button>
</form>
<div class="text-center pt-6 border-t border-[#2B3445]" data-sd-id="32">
<p class="text-sm text-[#7F8A9C]" data-sd-id="33">Don't have a personal account? <a href="#" id="create-account-link" class="text-[#5B55B8] font-medium hover:underline" data-sd-id="34">Create an account</a>
</p>
</div>
</div>
<div id="validation-announcer" aria-live="polite" class="sr-only" data-sd-id="35">
</div>
</div>
</main>
</div>
</body>
</html>
